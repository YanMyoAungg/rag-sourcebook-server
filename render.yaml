# Render Blueprint for the RAG Sourcebook server (free plan).
#
# Secrets marked `sync: false` are prompted for on first apply and can be set
# later in the dashboard:
#   DATABASE_URL               — Neon connection string (postgresql://…?sslmode=require)
#   OPENCODE_INFERENCE_API_KEY — OpenCode Go key (https://opencode.ai/console)
#   CLIENT_ORIGIN              — the deployed client origin, once the client ships
#
# MCP_ALLOWED_HOSTS is not set here: on Render the server uses the service's
# own hostname (RENDER_EXTERNAL_HOSTNAME) for MCP host-header validation.

services:
  - type: web
    name: rag-sourcebook-server
    runtime: node
    plan: free
    buildCommand: pnpm install --prod=false && pnpm build && pnpm warm-model
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENCODE_INFERENCE_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: OPENCODE_INFERENCE_BASE_URL
        value: https://opencode.ai/inference/go/openai/v1
      - key: CHAT_MODEL
        value: cat-jam-free
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2
